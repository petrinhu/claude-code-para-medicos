<script>
// Torna os checkboxes da secao "Antes de comecar" clicaveis e lembra o estado
// (localStorage por pagina). Marque durante a gravacao sem se perder.
document.querySelectorAll('input[type="checkbox"]').forEach(function (cb, i) {
  cb.disabled = false;
  cb.style.cursor = 'pointer';
  var key = 'chk:' + location.pathname + ':' + i;
  if (localStorage.getItem(key) === '1') cb.checked = true;
  cb.addEventListener('change', function () {
    localStorage.setItem(key, cb.checked ? '1' : '0');
  });
});
</script>
