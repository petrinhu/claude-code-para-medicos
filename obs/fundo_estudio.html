<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Fundo estudio - TribeMD</title>
<style>
  /* ==================================================================
     FUNDO DE ESTUDIO ANIMADO (1920x1080) para OBS.
     Foto de fundo + LEDs vivos (SVG) + letreiro de LED vermelho (canvas).
     Texto do letreiro pela URL:  fundo_estudio.html?texto=SUA FRASE
     Cor por NOME:   &cor=vermelho | ambar | laranja | amarelo | verde |
                     ciano | azul | roxo | rosa | branco   (hex tambem vale)
     Velocidade por NOME: &vel=lento | medio | rapido | turbo  (numero tambem)
     Letreiro rola da DIREITA para a ESQUERDA. LEDs respiram (luz aditiva).
     ================================================================== */
  html,body{ margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; }
  .cena{ position:relative; width:1920px; height:1080px; }
  .foto{ position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; }
  /* screen = luz ADITIVA: o brilho soma na foto (nao lava, so acende) */
  svg.leds{ position:absolute; inset:0; width:1920px; height:1080px;
            pointer-events:none; mix-blend-mode:screen; }
  canvas#letreiro{ position:absolute; left:558px; top:98px; }

  /* NEON: cada zona = halo largo + nucleo quase branco, os dois respirando
     em fases levemente diferentes (o nucleo "acende" antes do halo). */
  @keyframes neon{ 0%,100%{ opacity:.38 } 50%{ opacity:1 } }
  .z{ animation-name:neon; animation-timing-function:ease-in-out;
      animation-iteration-count:infinite; }
  .n1{ animation-duration:4.2s } .n2{ animation-duration:5.6s }
  .n3{ animation-duration:6.8s } .n4{ animation-duration:3.6s }
  @media (prefers-reduced-motion: reduce){ .z{ animation:none; opacity:.9 } }
</style>
</head>
<body>
<div class="cena">
  <img class="foto" src="fundo_16x9.png" alt="">

  <svg class="leds" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- sRGB: blur previsivel, sem estourar o branco -->
      <filter id="halo60" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="60"/></filter>
      <filter id="halo34" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="34"/></filter>
      <filter id="halo22" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="22"/></filter>
      <filter id="core12" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="12"/></filter>
      <filter id="core6"  x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="core3"  x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>

      <!-- geometria de cada zona, definida UMA vez (sem fill/stroke: a cor
           vem do <use>, para reaproveitar como halo e como nucleo) -->
      <g id="gSancaE"><rect x="-60" y="-70" width="470" height="150"/></g>
      <g id="gSancaD"><rect x="1540" y="-70" width="440" height="130"/></g>
      <g id="gSpots"><circle cx="300" cy="16" r="34"/><circle cx="1518" cy="18" r="34"/></g>
      <g id="gTelao"><rect x="540" y="226" width="866" height="516" rx="10" fill="none" stroke-width="22"/></g>
      <g id="gPratA"><rect x="150" y="298" width="330" height="10"/><rect x="150" y="612" width="330" height="10"/></g>
      <g id="gPratB"><rect x="150" y="452" width="330" height="10"/><rect x="150" y="788" width="330" height="10"/></g>
      <g id="gHex"><ellipse cx="1832" cy="500" rx="80" ry="118"/></g>
      <g id="gLum"><rect x="1540" y="400" width="14" height="330"/></g>
      <g id="gCadeira"><rect x="810" y="906" width="16" height="100" rx="8"/><rect x="1120" y="906" width="16" height="100" rx="8"/></g>
    </defs>

    <!-- (1) sanca de teto -->
    <g class="z n2">
      <use href="#gSancaE" fill="#12d8e6" filter="url(#halo60)"/>
      <use href="#gSancaE" fill="#d6feff" filter="url(#core12)"/>
    </g>
    <g class="z n3" style="animation-delay:-2.2s">
      <use href="#gSancaD" fill="#12d8e6" filter="url(#halo60)"/>
      <use href="#gSancaD" fill="#d6feff" filter="url(#core12)"/>
    </g>

    <!-- (2) spots embutidos no teto (luz quente) -->
    <g class="z n1" style="animation-delay:-1.1s">
      <use href="#gSpots" fill="#ffab3d" filter="url(#halo22)"/>
      <use href="#gSpots" fill="#fff3dc" filter="url(#core6)"/>
    </g>

    <!-- (3) moldura de neon do telao: azul arroxeado (halo violeta + nucleo lilas claro) -->
    <g class="z n2" style="animation-delay:-3.4s">
      <use href="#gTelao" stroke="#6b3cff" filter="url(#halo34)"/>
      <use href="#gTelao" stroke="#b98cff" filter="url(#halo22)"/>
      <use href="#gTelao" stroke="#e6d8ff" filter="url(#core6)"/>
    </g>

    <!-- (4) LEDs quentes das prateleiras (dois ritmos alternados) -->
    <g class="z n3" style="animation-delay:-.8s">
      <use href="#gPratA" fill="#ff9a24" filter="url(#halo22)"/>
      <use href="#gPratA" fill="#ffeac2" filter="url(#core3)" opacity=".5"/>
    </g>
    <g class="z n2" style="animation-delay:-4.1s">
      <use href="#gPratB" fill="#ff9a24" filter="url(#halo22)"/>
      <use href="#gPratB" fill="#ffeac2" filter="url(#core3)" opacity=".5"/>
    </g>

    <!-- (5) painel hexagonal (direita) -->
    <g class="z n3" style="animation-delay:-5.3s">
      <use href="#gHex" fill="#16d9e8" filter="url(#halo34)"/>
      <use href="#gHex" fill="#c6fdff" filter="url(#core12)" opacity=".45"/>
    </g>

    <!-- (6) luminaria vertical + borda da mesa -->
    <g class="z n1" style="animation-delay:-2.6s">
      <use href="#gLum" fill="#ffb445" filter="url(#halo22)"/>
      <use href="#gLum" fill="#fff0d4" filter="url(#core3)" opacity=".6"/>
    </g>

    <!-- (7) filetes de neon da cadeira -->
    <g class="z n4" style="animation-delay:-1.7s">
      <use href="#gCadeira" fill="#22dbe6" filter="url(#halo22)" opacity=".65"/>
      <use href="#gCadeira" fill="#d2feff" filter="url(#core3)" opacity=".3"/>
    </g>
  </svg>

  <!-- (3) letreiro de LED vermelho -->
  <canvas id="letreiro" width="826" height="72"></canvas>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  // underscore vale como espaco: ?texto=AULA_07_EVIDENCIA  (evita %20 na URL)
  var TEXTO = (q.get('texto') || 'CLAUDE CODE PARA MEDICOS   *   TRIBEMD   *   DO ZERO AO AVANCADO   *')
                .replace(/_/g, ' ').toUpperCase();

  // ---- apelidos em portugues (aceita acento, maiuscula e hex/numero) ----
  function normaliza(s){
    return (s || '').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');   // tira acentos
  }
  var CORES = {
    vermelho:'ff2a10', rubro:'ff2a10',
    ambar:'ffa000',    laranja:'ff6a00',  amarelo:'ffd400',
    verde:'2ae04a',    limao:'9bef2a',
    ciano:'20e0e8',    turquesa:'20e0e8',
    azul:'3a7bff',     roxo:'a24bff',     violeta:'a24bff',
    rosa:'ff3ea5',     magenta:'ff2ad0',  branco:'ffffff'
  };
  var VELS = { parado:0, lento:28, medio:55, normal:55, rapido:95, turbo:150 };

  var pCor = normaliza(q.get('cor'));
  var COR  = '#' + (CORES[pCor] || pCor.replace('#','') || 'ff2a10');

  var pVel = normaliza(q.get('vel'));
  var VEL  = (pVel in VELS) ? VELS[pVel] : (parseFloat(pVel) || 55);   // px por segundo

  var cv = document.getElementById('letreiro'), ctx = cv.getContext('2d');
  var LINHAS = 9, PASSO = 7, DOT = 5;                       // matriz de LEDs
  var COLS = Math.floor(cv.width / PASSO);

  // desenha o texto num buffer do tamanho exato da matriz e amostra os pixels
  var off = document.createElement('canvas');
  var octx = off.getContext('2d');
  octx.font = 'bold ' + LINHAS + 'px "DejaVu Sans Mono", monospace';
  var larguraTexto = Math.ceil(octx.measureText(TEXTO).width);
  off.width = larguraTexto + COLS;                          // folga para o loop
  off.height = LINHAS;
  var o2 = off.getContext('2d');
  o2.font = 'bold ' + LINHAS + 'px "DejaVu Sans Mono", monospace';
  o2.textBaseline = 'top';
  o2.fillStyle = '#fff';
  o2.fillText(TEXTO, 0, 0);
  var px = o2.getImageData(0, 0, off.width, off.height).data;

  function aceso(c, r){
    if (c < 0 || c >= off.width) return false;
    return px[((r * off.width) + c) * 4 + 3] > 110;         // alpha do texto
  }

  var offset = 0, last = 0;
  var x0 = (cv.width - COLS * PASSO) / 2;
  var y0 = (cv.height - LINHAS * PASSO) / 2;

  function frame(t){
    var dt = (t - last) / 1000; last = t;
    offset += VEL * dt;                                     // texto anda para a ESQUERDA
    if (offset > off.width) offset -= off.width;

    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(0,0,0,.34)';                      // painel do letreiro
    ctx.fillRect(0, 0, cv.width, cv.height);

    var base = Math.floor(offset);
    for (var c = 0; c < COLS; c++){
      var src = (base + c) % off.width;
      for (var r = 0; r < LINHAS; r++){
        var on = aceso(src, r);
        ctx.beginPath();
        ctx.arc(x0 + c * PASSO + DOT / 2, y0 + r * PASSO + DOT / 2, DOT / 2, 0, 6.2832);
        if (on){ ctx.fillStyle = COR; ctx.shadowColor = COR; ctx.shadowBlur = 7; }
        else   { ctx.fillStyle = 'rgba(66,12,8,.5)'; ctx.shadowBlur = 0; }
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(t){ last = t; frame(t); });
})();
</script>
</body>
</html>
