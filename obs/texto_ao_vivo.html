<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Texto ao vivo - TribeMD</title>
<style>
  /* =================================================================
     TEXTO AO VIVO para OBS (Browser Source + Interagir).
     Voce digita pela janela "Interagir" da fonte e o texto aparece
     na cena em tempo real. Ajustes pela URL:
       ?size=64     tamanho da fonte (px)
       ?color=ffcc00  cor do texto (hex sem #)
       ?pos=top|meio|baixo   posicao vertical (padrao: baixo)
       ?bg=1        liga uma faixa escura atras do texto (mais legivel)
       ?align=left|center|right  alinhamento (padrao: center)
     ================================================================= */
  :root{
    --tam: 60px;
    --cor: #FFFFFF;
    --roxo: #8a52ff;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    width:1920px; height:1080px;
    background: transparent;
    overflow: hidden;
    font-family: Inter, "Open Sans", "Segoe UI", sans-serif;
  }
  .palco{
    position:absolute; inset:0;
    display:flex;
    padding: 5vh 6vw;
  }
  .palco.baixo{ align-items:flex-end; }
  .palco.meio{ align-items:center; }
  .palco.top{ align-items:flex-start; }

  .campo{
    width:100%;
    font-size: var(--tam);
    font-weight: 800;
    line-height: 1.22;
    color: var(--cor);
    text-align: center;
    outline: none;
    caret-color: var(--roxo);
    /* sombra forte: legivel sobre qualquer fundo, sem precisar de caixa */
    text-shadow: 0 2px 10px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.95);
    word-break: break-word;
    min-height: 1.2em;
    border-radius: 14px;
    padding: 6px 10px;
  }
  /* faixa opcional (?bg=1) */
  body.bg .campo{
    background: rgba(20, 5, 45, 0.72);
    text-shadow: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    padding: 18px 28px;
  }
  /* placeholder so aparece com o campo em foco (janela Interagir),
     nunca na cena/gravacao quando vazio */
  .campo:focus:empty:before{
    content: attr(data-ph);
    color: rgba(255,255,255,.45);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="palco baixo" id="palco">
    <div class="campo" id="campo" contenteditable="true" spellcheck="false"
         data-ph="Digite aqui (janela Interagir)"></div>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var campo = document.getElementById('campo');
  var palco = document.getElementById('palco');
  var root = document.documentElement;

  // ajustes por URL
  if (q.get('size')) root.style.setProperty('--tam', parseInt(q.get('size'),10) + 'px');
  if (q.get('color')) root.style.setProperty('--cor', '#' + q.get('color').replace('#',''));
  if (q.get('align')) campo.style.textAlign = q.get('align');
  if (q.get('bg') === '1') document.body.classList.add('bg');
  var pos = q.get('pos');
  if (pos === 'top' || pos === 'meio' || pos === 'baixo'){
    palco.className = 'palco ' + pos;
  }

  // persistencia: o texto sobrevive a um refresh da fonte
  var KEY = 'obs_texto_ao_vivo';
  var salvo = localStorage.getItem(KEY);
  if (salvo) campo.textContent = salvo;
  campo.addEventListener('input', function(){
    localStorage.setItem(KEY, campo.textContent);
  });
  // Ctrl+L limpa tudo rapido
  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')){
      e.preventDefault();
      campo.textContent = '';
      localStorage.removeItem(KEY);
    }
  });
</script>
</body>
</html>
